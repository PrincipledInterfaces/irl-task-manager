<dialog id="settingsDialog">
    <article>
        <header>
            <button aria-label="Close" rel="prev" id="closeSettingsDialog"></button>
            <p>
                <strong>Settings</strong>
            </p>
        </header>
        <h5>Visual Options:</h5>
        <label for="themeSelector">Theme:</label>
        <select id="themeSelector">
            <!-- Theme options will be populated by themes.js -->
        </select>

        <label for="backgroundPatternSelector">Background Pattern:</label>
        <select id="backgroundPatternSelector" style="background-repeat: repeat; background-size: 50px; padding: 0.75rem;">
            <!-- Pattern options will be populated by themes.js -->
        </select>

        <p>*You may need to refresh the page to fully apply changes.</p>
    </article>
</dialog>
